name: Build & Deploy GoClaw (Podman Compose)

on:
  push:
    branches:
      - main
      - release/**
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'

jobs:
  build:
    name: Build Binary & Assets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "dev")
          ARTIFACT_VERSION=$(echo "$VERSION" | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_version=$ARTIFACT_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Build frontend
        run: |
          cd ui/web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Prepare webui dist
        run: |
          rm -rf src/openclaw/goclaw/internal/webui/dist
          mkdir -p src/openclaw/goclaw/internal/webui/dist
          cp -r ui/web/dist/* src/openclaw/goclaw/internal/webui/dist/

      - name: Build Go binary
        env:
          LDFLAGS: -s -w -X github.com/nextlevelbuilder/goclaw/cmd.Version=${{ steps.version.outputs.version }}
        run: |
          cd src/openclaw/goclaw
          CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o goclaw .

      - name: Prepare deployment package
        run: |
          mkdir -p deploy/${{ steps.version.outputs.artifact_version }}
          
          # Copy binary
          cp src/openclaw/goclaw/goclaw deploy/${{ steps.version.outputs.artifact_version }}/
          
          # Copy docker-compose files
          cp src/openclaw/goclaw/docker-compose.yml deploy/${{ steps.version.outputs.artifact_version }}/
          cp src/openclaw/goclaw/docker-compose.postgres.yml deploy/${{ steps.version.outputs.artifact_version }}/
          
          # Create podman-compose wrapper script
          cat > deploy/${{ steps.version.outputs.artifact_version }}/podman-compose.sh << 'EOF'
          #!/bin/bash
          # Podman Compose wrapper - converts docker-compose to podman-compose
          set -euo pipefail
          
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"
          
          # Replace docker-compose with podman-compose
          exec podman-compose -f docker-compose.yml -f docker-compose.postgres.yml "$@"
          EOF
          chmod +x deploy/${{ steps.version.outputs.artifact_version }}/podman-compose.sh
          
          # Create deployment script
          cat > deploy/${{ steps.version.outputs.artifact_version }}/deploy.sh << 'DEPLOY_EOF'
          #!/bin/bash
          set -euo pipefail
          
          APP_NAME="goclaw"
          COMPOSE_FILE="docker-compose.yml"
          COMPOSE_POSTGRES="docker-compose.postgres.yml"
          
          echo "🚀 Starting $APP_NAME deployment..."
          
          # Stop existing container if running
          podman-compose -f "$COMPOSE_FILE" -f "$COMPOSE_POSTGRES" down 2>/dev/null || true
          
          # Pull latest images
          podman-compose -f "$COMPOSE_FILE" -f "$COMPOSE_POSTGRES" pull || true
          
          # Start services
          podman-compose -f "$COMPOSE_FILE" -f "$COMPOSE_POSTGRES" up -d
          
          # Cleanup old images
          podman image prune -f
          
          echo "✅ Deployment complete!"
          podman ps --filter "name=$APP_NAME"
          DEPLOY_EOF
          chmod +x deploy/${{ steps.version.outputs.artifact_version }}/deploy.sh
          
          # Copy .env.example if exists
          [[ -f src/openclaw/goclaw/.env.example ]] && \
            cp src/openclaw/goclaw/.env.example deploy/${{ steps.version.outputs.artifact_version }}/

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: goclaw-deploy-${{ steps.version.outputs.artifact_version }}
          path: deploy/${{ steps.version.outputs.artifact_version }}/
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env == 'staging' || github.event_name != 'workflow_dispatch'
    environment: staging
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: goclaw-deploy-${{ needs.build.outputs.artifact_version }}
          path: ./deploy

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALIYUN_ECS_MINI_CICD_KEY }}

      - name: Deploy to Staging
        env:
          TARGET_HOST: ${{ secrets.STAGING_HOST }}
          TARGET_USER: ${{ secrets.STAGING_USER || 'aliops' }}
          VERSION: ${{ needs.build.outputs.artifact_version }}
        run: |
          chmod +x deploy/*.sh
          
          REPO_NAME="goclaw"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          REMOTE_BASE_DIR="~/.activate/${REPO_NAME}"
          REMOTE_RELEASE_DIR="${REMOTE_BASE_DIR}/${TIMESTAMP}"
          
          echo "📦 Deploying goclaw v${VERSION} to staging..."
          echo "🎯 Target: ${TARGET_USER}@${TARGET_HOST}:${REMOTE_RELEASE_DIR}"
          
          # Create remote directory
          ssh -o StrictHostKeyChecking=no ${TARGET_USER}@${TARGET_HOST} \
            "mkdir -p ${REMOTE_RELEASE_DIR}"
          
          # Upload files
          scp -o StrictHostKeyChecking=no -r ./deploy/* ${TARGET_USER}@${TARGET_HOST}:${REMOTE_RELEASE_DIR}/
          
          # Update symlink
          ssh -o StrictHostKeyChecking=no ${TARGET_USER}@${TARGET_HOST} \
            "ln -sfn ${REMOTE_RELEASE_DIR} ${REMOTE_BASE_DIR}/latest"
          
          # Execute deployment
          ssh -o StrictHostKeyChecking=no ${TARGET_USER}@${TARGET_HOST} \
            "cd ${REMOTE_RELEASE_DIR} && chmod +x deploy.sh && ./deploy.sh"
          
          echo "✅ Staging deployment successful!"

  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env == 'production' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: goclaw-deploy-${{ needs.build.outputs.artifact_version }}
          path: ./deploy

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy to Production
        env:
          TARGET_HOST: ${{ secrets.PROD_HOST }}
          TARGET_USER: ${{ secrets.PROD_USER || 'aliops' }}
          VERSION: ${{ needs.build.outputs.artifact_version }}
        run: |
          chmod +x deploy/*.sh
          
          REPO_NAME="goclaw"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          REMOTE_BASE_DIR="~/.activate/${REPO_NAME}"
          REMOTE_RELEASE_DIR="${REMOTE_BASE_DIR}/${TIMESTAMP}"
          
          echo "🚀 PRODUCTION DEPLOYMENT"
          echo "📦 Deploying goclaw v${VERSION} to production..."
          echo "🎯 Target: ${TARGET_USER}@${TARGET_HOST}:${REMOTE_RELEASE_DIR}"
          
          # Create remote directory
          ssh -o StrictHostKeyChecking=no ${TARGET_USER}@${TARGET_HOST} \
            "mkdir -p ${REMOTE_RELEASE_DIR}"
          
          # Upload files
          scp -o StrictHostKeyChecking=no -r ./deploy/* ${TARGET_USER}@${TARGET_HOST}:${REMOTE_RELEASE_DIR}/
          
          # Update symlink
          ssh -o StrictHostKeyChecking=no ${TARGET_USER}@${TARGET_HOST} \
            "ln -sfn ${REMOTE_RELEASE_DIR} ${REMOTE_BASE_DIR}/latest"
          
          # Execute deployment with backup
          ssh -o StrictHostKeyChecking=no ${TARGET_USER}@${TARGET_HOST} << 'SSHEOF'
            cd ${REMOTE_RELEASE_DIR}
            chmod +x deploy.sh
            ./deploy.sh
          SSHEOF
          
          echo "✅ Production deployment successful!"

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Rollback to previous version
        env:
          TARGET_HOST: ${{ secrets.PROD_HOST }}
          TARGET_USER: ${{ secrets.PROD_USER || 'aliops' }}
        run: |
          echo "🔄 Rolling back goclaw..."
          
          ssh -o StrictHostKeyChecking=no ${TARGET_USER}@${TARGET_HOST} << 'SSHEOF'
            cd ~/.activate/goclaw
            LATEST=$(readlink latest)
            PREVIOUS=$(ls -1t | grep -v latest | head -1)
            
            if [ -n "$PREVIOUS" ]; then
              echo "🔄 Rolling back from $LATEST to $PREVIOUS"
              ln -sfn "$PREVIOUS" latest
              cd latest && ./deploy.sh
              echo "✅ Rollback complete!"
            else
              echo "❌ No previous version found to rollback to"
              exit 1
            fi
          SSHEOF
