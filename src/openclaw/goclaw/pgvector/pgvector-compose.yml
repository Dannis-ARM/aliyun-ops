services:
  db:
    image: docker.io/pgvector/pgvector:pg18-bookworm
    container_name: pgvector-db
    restart: always  # 确保 ECS 重启或容器崩溃后能自动拉起
    shm_size: 1g     # 重要：pgvector 在处理大规模向量索引（如 HNSW）时需要较大的共享内存
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      # 显式指定数据库名，避免脚本连接时因库不存在而报错
      POSTGRES_DB: goclaw
    volumes:
      - postgres_pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432" # 建议仅监听本地，防止 ECS 公网 IP 被扫描

volumes:
  postgres_pgdata: 